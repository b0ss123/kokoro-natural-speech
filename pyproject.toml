[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kokoro-natural-speech"
version = "0.1.0"
description = "Make Kokoro TTS sound like a person: numbers, phone numbers, addresses, exact phonemes and natural pauses"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4", "soundfile"]

[tool.setuptools]
py-modules = ["kokoro_natural"]
